[project]
name = "robot-mcp"
version = "0.2.3"
description = "Serveur MCP pour piloter Autodesk Robot Structural Analysis depuis Claude (API COM RobotOM)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2,<2",
    "matplotlib>=3.8",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
robot-mcp = "robot_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robot_mcp"]
